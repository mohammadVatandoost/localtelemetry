apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: otel
  namespace: telemetry
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: otel-platform
spec:
  version: 9.5.6
  count: 1
  elasticsearchRef:
    name: otel
  http:
    service:
      spec:
        type: NodePort
        ports:
          - name: https
            port: 5601
            nodePort: 30601
            protocol: TCP
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
        app.kubernetes.io/part-of: otel-platform
    spec:
      containers:
        - name: kibana
          env:
            # 1Gi aborted Node during startup (heap ~750Mi). 1536 stays inside the 2Gi limit.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
