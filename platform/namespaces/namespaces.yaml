# node-exporter reads the host through hostNetwork, hostPID, hostPath, and
# hostPort. Baseline rejects all four, so this namespace is privileged.
# audit and warn stay restricted so the exception remains visible.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: otel-platform
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
