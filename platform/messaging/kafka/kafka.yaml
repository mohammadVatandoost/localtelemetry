# Short JMX ruleset. An empty rules file exports every Kafka MBean and is too
# expensive on a laptop. Names below are what the Grafana Kafka dashboard queries.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics
  namespace: kafka
  labels:
    app.kubernetes.io/name: kafka-metrics
    app.kubernetes.io/part-of: otel-platform
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      - pattern: kafka.server<type=ReplicaManager, name=UnderReplicatedPartitions><>Value
        name: kafka_server_replicamanager_underreplicatedpartitions
        type: GAUGE
      - pattern: kafka.server<type=ReplicaManager, name=PartitionCount><>Value
        name: kafka_server_replicamanager_partitioncount
        type: GAUGE
      - pattern: kafka.server<type=BrokerTopicMetrics, name=(BytesInPerSec|BytesOutPerSec|MessagesInPerSec)><>Count
        name: kafka_server_brokertopicmetrics_$1_total
        type: COUNTER
      - pattern: kafka.server<type=BrokerTopicMetrics, name=(BytesInPerSec|BytesOutPerSec|MessagesInPerSec), topic=(.+)><>Count
        name: kafka_server_brokertopicmetrics_$1_total
        type: COUNTER
        labels:
          topic: "$2"
      - pattern: kafka.server<type=KafkaServer, name=BrokerState><>Value
        name: kafka_server_kafkaserver_brokerstate
        type: GAUGE
      - pattern: kafka.log<type=Log, name=Size, topic=(.+), partition=(.+)><>Value
        name: kafka_log_size_bytes
        type: GAUGE
        labels:
          topic: "$1"
          partition: "$2"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: otel
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: otel-platform
spec:
  replicas: 1
  roles:
    - controller
    - broker
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  jvmOptions:
    -Xms: 384m
    -Xmx: 384m
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        kraftMetadata: shared
        deleteClaim: false
        class: local-path
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: otel
  namespace: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: otel-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  kafka:
    version: 4.3.2
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: "false"
      log.retention.hours: 24
      log.retention.bytes: 1073741824
      log.segment.bytes: 134217728
      message.max.bytes: 10485760
      replica.fetch.max.bytes: 10485760
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
    userOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
  kafkaExporter:
    topicRegex: "^otel-.*"
    groupRegex: ".*"
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: otel-logs
  namespace: kafka
  labels:
    strimzi.io/cluster: otel
    app.kubernetes.io/name: otel-logs
    app.kubernetes.io/part-of: otel-platform
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: "86400000"
    retention.bytes: "536870912"
    segment.bytes: "134217728"
    min.insync.replicas: "1"
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: otel-traces
  namespace: kafka
  labels:
    strimzi.io/cluster: otel
    app.kubernetes.io/name: otel-traces
    app.kubernetes.io/part-of: otel-platform
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: "86400000"
    retention.bytes: "536870912"
    segment.bytes: "134217728"
    min.insync.replicas: "1"
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: otel-metrics
  namespace: kafka
  labels:
    strimzi.io/cluster: otel
    app.kubernetes.io/name: otel-metrics
    app.kubernetes.io/part-of: otel-platform
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: "86400000"
    retention.bytes: "536870912"
    segment.bytes: "134217728"
    min.insync.replicas: "1"
    cleanup.policy: delete
---
apiVersion: v1
kind: Service
metadata:
  name: otel-kafka-metrics
  namespace: kafka
  labels:
    app.kubernetes.io/name: kafka-metrics
    app.kubernetes.io/part-of: otel-platform
spec:
  selector:
    strimzi.io/cluster: otel
    strimzi.io/component-type: kafka
  ports:
    - name: metrics
      port: 9404
      targetPort: 9404
      protocol: TCP
