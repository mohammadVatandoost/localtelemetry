apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-collector
  labels:
    app.kubernetes.io/name: backend-collector
    app.kubernetes.io/part-of: otel-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-collector
  labels:
    app.kubernetes.io/name: backend-collector
    app.kubernetes.io/part-of: otel-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-collector
        app.kubernetes.io/part-of: otel-platform
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: backend-collector
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.165.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/conf/config.yaml
            - --feature-gates=+extension.healthcheck.useComponentStatus
          ports:
            - name: metrics
              containerPort: 8888
            - name: health
              containerPort: 13133
          env:
            - name: GOMEMLIMIT
              value: 200MiB
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: otel-es-elastic-user
                  key: elastic
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: health
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: health
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: storage
              mountPath: /var/lib/otelcol
            - name: es-ca
              mountPath: /tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: backend-collector-config
        - name: storage
          emptyDir:
            sizeLimit: 512Mi
        - name: es-ca
          secret:
            secretName: otel-es-http-certs-public
---
apiVersion: v1
kind: Service
metadata:
  name: backend-collector
  labels:
    app.kubernetes.io/name: backend-collector
    app.kubernetes.io/part-of: otel-platform
spec:
  selector:
    app.kubernetes.io/name: backend-collector
  ports:
    - name: metrics
      port: 8888
      targetPort: metrics
    - name: health
      port: 13133
      targetPort: health
