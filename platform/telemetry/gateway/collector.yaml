apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-collector
  labels:
    app.kubernetes.io/name: gateway-collector
    app.kubernetes.io/part-of: otel-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-collector
  labels:
    app.kubernetes.io/name: gateway-collector
    app.kubernetes.io/part-of: otel-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-collector
        app.kubernetes.io/part-of: otel-platform
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: gateway-collector
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.165.1
          imagePullPolicy: IfNotPresent
          args:
            - --config=/conf/config.yaml
            - --feature-gates=+extension.healthcheck.useComponentStatus
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8888
            - name: slo
              containerPort: 8889
            - name: health
              containerPort: 13133
          env:
            - name: GOMEMLIMIT
              value: 200MiB
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: health
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: health
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: storage
              mountPath: /var/lib/otelcol
      volumes:
        - name: config
          configMap:
            name: gateway-collector-config
        - name: storage
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-collector
  labels:
    app.kubernetes.io/name: gateway-collector
    app.kubernetes.io/part-of: otel-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      nodePort: 30317
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      nodePort: 30318
    - name: metrics
      port: 8888
      targetPort: metrics
    - name: slo
      port: 8889
      targetPort: slo
    - name: health
      port: 13133
      targetPort: health
