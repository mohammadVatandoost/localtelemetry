apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-collector
  labels:
    app.kubernetes.io/name: gateway-collector
    app.kubernetes.io/part-of: otel-platform
---
# kubeletstats reads nodes/stats. k8sattributes reads pods and replica sets
# so Kafka and Grafana logs keep their deployment name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gateway-collector
  labels:
    app.kubernetes.io/name: gateway-collector
    app.kubernetes.io/part-of: otel-platform
rules:
  - apiGroups: [""]
    resources: ["nodes/stats"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gateway-collector
  labels:
    app.kubernetes.io/name: gateway-collector
    app.kubernetes.io/part-of: otel-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gateway-collector
subjects:
  - kind: ServiceAccount
    name: gateway-collector
    namespace: telemetry
---
# One gateway on every node, including the control-plane. Each pod receives
# OTLP, tails Kafka and Grafana logs on that node, and reads that node's
# kubelet pod metrics. The backend stays one Deployment: each topic has one
# partition, so extra consumers do not add throughput.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gateway-collector
  labels:
    app.kubernetes.io/name: gateway-collector
    app.kubernetes.io/part-of: otel-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-collector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-collector
        app.kubernetes.io/part-of: otel-platform
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: gateway-collector
      terminationGracePeriodSeconds: 40
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      # Pod log files on the node are mode 0640 and owned by root. Group 0 can
      # read them. The user stays 10001.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 0
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.165.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/conf/config.yaml
            - --feature-gates=+extension.healthcheck.useComponentStatus
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8888
            - name: slo
              containerPort: 8889
            - name: health
              containerPort: 13133
          env:
            - name: GOMEMLIMIT
              value: 300MiB
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: health
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: health
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: storage
              mountPath: /var/lib/otelcol
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gateway-collector-config
        - name: storage
          emptyDir:
            sizeLimit: 512Mi
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory
---
# NodePort is only for the two OTLP ports. Every port on a NodePort Service
# receives a nodePort, and Kubernetes handed 30920 to the SLO port. That is the
# nodePort Elasticsearch needs, so ECK could not create otel-es-http.
apiVersion: v1
kind: Service
metadata:
  name: gateway-collector
  labels:
    app.kubernetes.io/name: gateway-collector
    app.kubernetes.io/part-of: otel-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      nodePort: 30317
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      nodePort: 30318
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-collector-metrics
  labels:
    app.kubernetes.io/name: gateway-collector
    app.kubernetes.io/part-of: otel-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway-collector
  ports:
    - name: metrics
      port: 8888
      targetPort: metrics
    - name: slo
      port: 8889
      targetPort: slo
    - name: health
      port: 13133
      targetPort: health
