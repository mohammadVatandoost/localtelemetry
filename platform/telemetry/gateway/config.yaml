# Gateway collector, contrib 0.165.0.
#
# Logs pipeline adds transform/observe and the signaltometrics connector.
# transform/observe fills a zero ObservedTimestamp at this process and does not
# replace one that the SDK already set. The connector emits the event-age
# histogram used by the log SLO. It is not part of the Kafka path.
#
# filelog/pods tails container logs for the Kafka namespace and the Grafana
# deployment. kubeletstats reads pod and container usage from the local kubelet.
# Both follow the same Kafka topics as OTLP. Kafka broker metrics are scraped
# once by the backend, not here.
#
# Memory limiter uses absolute MiB because limit_percentage can follow node
# memory instead of the container limit. If you raise the 384Mi limit, raise
# limit_mib as well. spike_limit_mib is included inside limit_mib.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true
    timeout: 1s

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Kind writes CRI logs under /var/log/pods/<namespace>_<pod>_<uid>/<container>/.
  # start_at end ignores lines already on disk. storage keeps the offset across
  # a container restart so those lines are not sent again.
  filelog/pods:
    include:
      - /var/log/pods/kafka_*/*/*.log
      - /var/log/pods/observability_grafana-*/*/*.log
    exclude:
      - /var/log/pods/observability_grafana-admin-*/*/*.log
    start_at: end
    storage: file_storage
    include_file_path: true
    include_file_name: false
    operators:
      - type: container
        id: container-parser
      - type: move
        from: attributes["k8s.namespace.name"]
        to: resource["k8s.namespace.name"]
      - type: move
        from: attributes["k8s.pod.name"]
        to: resource["k8s.pod.name"]
      - type: move
        from: attributes["k8s.pod.uid"]
        to: resource["k8s.pod.uid"]
      - type: move
        from: attributes["k8s.container.name"]
        to: resource["k8s.container.name"]
      - type: move
        from: attributes["k8s.container.restart_count"]
        to: resource["k8s.container.restart_count"]
  kubeletstats:
    collection_interval: 30s
    auth_type: serviceAccount
    endpoint: "https://${env:K8S_NODE_IP}:10250"
    insecure_skip_verify: true
    metric_groups:
      - pod
      - container

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 300
    spike_limit_mib: 50
  transform/observe:
    error_mode: ignore
    log_statements:
      - context: log
        conditions:
          - observed_time_unix_nano == 0
        statements:
          - set(observed_time, Now())
  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512
  # signaltometrics emits delta histograms whose start time is the epoch.
  # The Prometheus exporter drops every later point unless those deltas are
  # accumulated first, so the 30s ratio would stay frozen after the first batch.
  delta_to_cumulative:
    max_stale: 15m
  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    filter:
      node_from_env_var: K8S_NODE_NAME
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.deployment.name
        - k8s.container.name
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid

connectors:
  signaltometrics:
    error_mode: ignore
    logs:
      - name: otel.log.event_age
        description: Gateway ObservedTimestamp minus Timestamp for logs with a usable pair of timestamps
        unit: s
        include_resource_attributes:
          - key: otel.platform.boundary
            default_value: gateway
        conditions:
          - log.time_unix_nano > 0 and log.observed_time_unix_nano > 0 and log.observed_time_unix_nano >= log.time_unix_nano
        histogram:
          buckets: [0.1, 0.5, 1, 2, 5, 10, 30, 60, 120, 300]
          value: (log.observed_time_unix_nano - log.time_unix_nano) / 1000000000.0
      - name: otel.log.timestamp_missing
        description: Log records missing Timestamp or ObservedTimestamp
        unit: "1"
        include_resource_attributes:
          - key: otel.platform.boundary
            default_value: gateway
        conditions:
          - log.time_unix_nano == 0 or log.observed_time_unix_nano == 0
        sum:
          value: "1"
          monotonic: true
      - name: otel.log.timestamp_negative
        description: Log records whose ObservedTimestamp is earlier than Timestamp
        unit: "1"
        include_resource_attributes:
          - key: otel.platform.boundary
            default_value: gateway
        conditions:
          - log.time_unix_nano > 0 and log.observed_time_unix_nano > 0 and log.observed_time_unix_nano < log.time_unix_nano
        sum:
          value: "1"
          monotonic: true

exporters:
  kafka:
    brokers:
      - otel-kafka-bootstrap.kafka.svc.cluster.local:9092
    client_id: otel-gateway
    timeout: 15s
    logs:
      topic: otel-logs
      encoding: otlp_proto
    traces:
      topic: otel-traces
      encoding: otlp_proto
    metrics:
      topic: otel-metrics
      encoding: otlp_proto
    producer:
      max_message_bytes: 8000000
      required_acks: 1
      compression: lz4
      allow_auto_topic_creation: false
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 100
      block_on_overflow: true
      storage: file_storage
  prometheus/slo:
    endpoint: 0.0.0.0:8889
    metric_expiration: 15m
    resource_to_telemetry_conversion:
      enabled: false

service:
  extensions: [health_check, file_storage]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: false
                without_units: false
                without_scope_info: true
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/observe, batch]
      exporters: [kafka, signaltometrics]
    # Pod logs stay off the SLO connector. That histogram is only for OTLP logs.
    logs/pods:
      receivers: [filelog/pods]
      processors: [memory_limiter, k8sattributes, transform/observe, batch]
      exporters: [kafka]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [kafka]
    metrics:
      receivers: [otlp, kubeletstats]
      processors: [memory_limiter, batch]
      exporters: [kafka]
    metrics/event_age:
      receivers: [signaltometrics]
      processors: [delta_to_cumulative, batch]
      exporters: [prometheus/slo]
