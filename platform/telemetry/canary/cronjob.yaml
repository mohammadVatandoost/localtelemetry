apiVersion: batch/v1
kind: CronJob
metadata:
  name: telemetry-canary
  namespace: telemetry
  labels:
    app.kubernetes.io/name: telemetry-canary
    app.kubernetes.io/part-of: otel-platform
spec:
  schedule: "* * * * *"
  # Replace a run that never started. runAsNonRoot used to reject this image,
  # and Forbid would keep that stuck Job from ever being superseded.
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 70
      template:
        metadata:
          labels:
            app.kubernetes.io/name: telemetry-canary
            app.kubernetes.io/part-of: otel-platform
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            # curlimages/curl:8.16.0 sets User to the name curl_user (uid 101).
            # kubelet will not start the container unless the uid is numeric.
            runAsUser: 101
            runAsGroup: 102
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: canary
              image: curlimages/curl:8.16.0
              imagePullPolicy: IfNotPresent
              command: ["sh", "/script/canary.sh"]
              env:
                - name: TRACE_OBJECTIVE_SECONDS
                  value: "60"
                - name: METRIC_OBJECTIVE_SECONDS
                  value: "60"
                - name: ELASTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: otel-es-elastic-user
                      key: elastic
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /script
                - name: tls
                  mountPath: /tls
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: telemetry-canary
                defaultMode: 0555
            - name: tls
              secret:
                secretName: otel-es-http-certs-public
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
