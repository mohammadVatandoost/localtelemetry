# Strimzi 1.3.1 chart defaults request 384Mi. The operator is a JVM that watches
# every namespace, so the 256Mi target is too small. 384Mi request / 512Mi limit.
replicas: 1
watchAnyNamespace: true
generateNetworkPolicy: false
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 512Mi
