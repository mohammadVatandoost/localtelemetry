alertmanager:
  enabled: false

kube-state-metrics:
  enabled: true
  fullnameOverride: kube-state-metrics
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

prometheus-node-exporter:
  enabled: true
  fullnameOverride: node-exporter
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

prometheus-pushgateway:
  enabled: true
  fullnameOverride: pushgateway
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

server:
  fullnameOverride: prometheus-server
  retention: 30d
  retentionSize: 8GB
  global:
    scrape_interval: 30s
    evaluation_interval: 30s
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  extraFlags:
    - web.enable-lifecycle

# API and unfiltered pod discovery stay off. Kubelet and cAdvisor stay on
# because the Strimzi KRaft dashboard queries container and volume metrics.
scrapeConfigs:
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: true
  kubernetes-nodes-cadvisor:
    enabled: true
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false
  prometheus:
    enabled: true
    static_configs:
      - targets:
          - localhost:9090
  # Pod discovery, not the Service. A Service scrape would hit one DaemonSet
  # pod per interval and mix histogram series from different nodes.
  otel-gateway:
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: keep
        regex: gateway-collector
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: metrics
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      - target_label: collector
        replacement: gateway
  otel-gateway-slo:
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: keep
        regex: gateway-collector
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: slo
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      - target_label: collector
        replacement: gateway
  otel-backend:
    static_configs:
      - targets:
          - backend-collector.telemetry.svc.cluster.local:8888
        labels:
          collector: backend
  # Pod discovery keeps strimzi_io_cluster, namespace, and kubernetes_pod_name.
  # The official Strimzi dashboards select on those labels. A Service target
  # does not have them, and Strimzi does not create otel-kafka-exporter.
  kafka:
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_strimzi_io_kind]
        action: keep
        regex: Kafka
      - source_labels: [__meta_kubernetes_pod_label_strimzi_io_component_type]
        action: keep
        regex: kafka
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: tcp-prometheus
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(strimzi_io_.+)
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: kubernetes_pod_name
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node_name
  kafka-exporter:
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_strimzi_io_component_type]
        action: keep
        regex: kafka-exporter
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: tcp-prometheus
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(strimzi_io_.+)
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: kubernetes_pod_name
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node_name
  strimzi-operator:
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_strimzi_io_kind]
        action: keep
        regex: cluster-operator
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: http
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
  strimzi-entity-operator:
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: keep
        regex: entity-operator
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: healthcheck-(to|uo)
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
  elasticsearch:
    static_configs:
      - targets:
          - elasticsearch-exporter.telemetry.svc.cluster.local:9108
  kube-state-metrics:
    static_configs:
      - targets:
          - kube-state-metrics.observability.svc.cluster.local:8080
  node-exporter:
    static_configs:
      - targets:
          - node-exporter.observability.svc.cluster.local:9100
  pushgateway:
    honor_labels: true
    static_configs:
      - targets:
          - pushgateway.observability.svc.cluster.local:9091

serverFiles:
  recording_rules.yml:
    groups:
      - name: otel-ingestion-slo
        interval: 30s
        rules:
          # Event-based log SLO. The denominator is only logs with a non-negative
          # ObservedTimestamp - Timestamp. Missing and negative durations are
          # counted by the quality rules and are not treated as fast events.
          # The gateway Prometheus exporter writes the 30 second bound as le="30.0".
          - record: slo:logs_event_age:within_30s:ratio_30d
            expr: |
              sum(rate(otel_log_event_age_seconds_bucket{le=~"30(\\.0)?",job="otel-gateway-slo"}[30d]))
              /
              clamp_min(sum(rate(otel_log_event_age_seconds_bucket{le="+Inf",job="otel-gateway-slo"}[30d])), 1e-12)
          - record: slo:logs_event_age:within_30s:ratio_1h
            expr: |
              sum(rate(otel_log_event_age_seconds_bucket{le=~"30(\\.0)?",job="otel-gateway-slo"}[1h]))
              /
              clamp_min(sum(rate(otel_log_event_age_seconds_bucket{le="+Inf",job="otel-gateway-slo"}[1h])), 1e-12)
          - record: slo:logs_event_age:target
            expr: "0.999"
          # Missing and negative counters are absent until the first bad log.
          # vector(0) keeps the ratio defined for a clean window.
          - record: slo:logs_timestamp_quality:invalid_ratio_1h
            expr: |
              (
                (sum(rate(otel_log_timestamp_missing_total{job="otel-gateway-slo"}[1h])) or vector(0))
                +
                (sum(rate(otel_log_timestamp_negative_total{job="otel-gateway-slo"}[1h])) or vector(0))
              )
              /
              clamp_min(
                (sum(rate(otel_log_timestamp_missing_total{job="otel-gateway-slo"}[1h])) or vector(0))
                + (sum(rate(otel_log_timestamp_negative_total{job="otel-gateway-slo"}[1h])) or vector(0))
                + (sum(rate(otel_log_event_age_seconds_count{job="otel-gateway-slo"}[1h])) or vector(0)),
                1e-12
              )
          # Probe-based canary SLO. Each CronJob run writes a 0/1 gauge.
          # avg_over_time approximates the fraction of probes inside the window
          # while the job keeps its one-minute schedule. It is not the fraction
          # of all production traces or metric points.
          - record: slo:traces_canary:within_objective:ratio_30d
            expr: avg_over_time(otel_canary_within_objective{signal="traces"}[30d])
          - record: slo:metrics_canary:within_objective:ratio_30d
            expr: avg_over_time(otel_canary_within_objective{signal="metrics"}[30d])
          - record: slo:traces_canary:within_objective:ratio_1h
            expr: avg_over_time(otel_canary_within_objective{signal="traces"}[1h])
          - record: slo:metrics_canary:within_objective:ratio_1h
            expr: avg_over_time(otel_canary_within_objective{signal="metrics"}[1h])
          - record: slo:traces_canary:target
            expr: "0.999"
          - record: slo:metrics_canary:target
            expr: "0.999"
          # Sum by collector and exporter before adding. The failure counters carry
          # error.type, and a missing signal must contribute 0 rather than drop the series.
          - record: slo:pipeline:export_success:ratio_5m
            expr: |
              (
                sum by (collector, exporter) (rate(otelcol_exporter_sent_log_records_total[5m]))
                + (sum by (collector, exporter) (rate(otelcol_exporter_sent_spans_total[5m])) or (sum by (collector, exporter) (rate(otelcol_exporter_sent_log_records_total[5m])) * 0))
                + (sum by (collector, exporter) (rate(otelcol_exporter_sent_metric_points_total[5m])) or (sum by (collector, exporter) (rate(otelcol_exporter_sent_log_records_total[5m])) * 0))
              )
              /
              clamp_min(
                (
                  sum by (collector, exporter) (rate(otelcol_exporter_sent_log_records_total[5m]))
                  + (sum by (collector, exporter) (rate(otelcol_exporter_send_failed_log_records_total[5m])) or (sum by (collector, exporter) (rate(otelcol_exporter_sent_log_records_total[5m])) * 0))
                )
                + (
                  (sum by (collector, exporter) (rate(otelcol_exporter_sent_spans_total[5m])) or (sum by (collector, exporter) (rate(otelcol_exporter_sent_log_records_total[5m])) * 0))
                  + (sum by (collector, exporter) (rate(otelcol_exporter_send_failed_spans_total[5m])) or (sum by (collector, exporter) (rate(otelcol_exporter_sent_log_records_total[5m])) * 0))
                )
                + (
                  (sum by (collector, exporter) (rate(otelcol_exporter_sent_metric_points_total[5m])) or (sum by (collector, exporter) (rate(otelcol_exporter_sent_log_records_total[5m])) * 0))
                  + (sum by (collector, exporter) (rate(otelcol_exporter_send_failed_metric_points_total[5m])) or (sum by (collector, exporter) (rate(otelcol_exporter_sent_log_records_total[5m])) * 0))
                ),
                1e-12
              )
          - record: kafka:consumer_lag:otel_backend
            expr: sum by (topic) (kafka_consumergroup_lag{consumergroup="otel-backend"})
