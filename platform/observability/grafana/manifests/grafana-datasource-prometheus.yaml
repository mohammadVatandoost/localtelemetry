apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-prometheus
  namespace: observability
  labels:
    grafana_datasource: '1'
    app.kubernetes.io/part-of: otel-platform
data:
  prometheus.yaml: "apiVersion: 1\ndatasources:\n  - name: Prometheus\n    type: prometheus\n\
    \    uid: prometheus\n    access: proxy\n    url: http://prometheus-server.observability.svc.cluster.local\n\
    \    isDefault: true\n"
