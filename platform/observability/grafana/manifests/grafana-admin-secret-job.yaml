# Creates grafana-admin when bootstrap did not. The password stays out of Git.
# The Job leaves an existing secret alone, so a later sync does not rotate it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-admin-secret
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana-admin-secret
    app.kubernetes.io/part-of: otel-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-admin-secret
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana-admin-secret
    app.kubernetes.io/part-of: otel-platform
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-admin-secret
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana-admin-secret
    app.kubernetes.io/part-of: otel-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-admin-secret
subjects:
  - kind: ServiceAccount
    name: grafana-admin-secret
    namespace: observability
---
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-admin-secret
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana-admin-secret
    app.kubernetes.io/part-of: otel-platform
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-admin-secret
        app.kubernetes.io/part-of: otel-platform
    spec:
      restartPolicy: OnFailure
      serviceAccountName: grafana-admin-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create
          image: curlimages/curl:8.16.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              api="https://kubernetes.default.svc/api/v1/namespaces/observability/secrets"
              token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              cacrt="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              code="$(curl -sS -o /tmp/body -w '%{http_code}' --cacert "${cacrt}" -H "Authorization: Bearer ${token}" "${api}/grafana-admin")"
              if [ "${code}" = "200" ]; then
                echo "grafana-admin already exists"
                exit 0
              fi
              if [ "${code}" != "404" ]; then
                cat /tmp/body
                echo "unexpected status ${code}" >&2
                exit 1
              fi
              pass="$(dd if=/dev/urandom bs=24 count=1 2>/dev/null | base64 | tr -d '\n' | tr '+/' 'AZ')"
              user_b64="$(printf '%s' admin | base64 | tr -d '\n')"
              pass_b64="$(printf '%s' "${pass}" | base64 | tr -d '\n')"
              curl -sS -f --cacert "${cacrt}" \
                -H "Authorization: Bearer ${token}" \
                -H "Content-Type: application/json" \
                -X POST "${api}" \
                -d "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"grafana-admin\",\"namespace\":\"observability\",\"labels\":{\"app.kubernetes.io/name\":\"grafana-admin\",\"app.kubernetes.io/part-of\":\"otel-platform\"}},\"type\":\"Opaque\",\"data\":{\"admin-user\":\"${user_b64}\",\"admin-password\":\"${pass_b64}\"}}"
              echo "created grafana-admin"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 4Mi
