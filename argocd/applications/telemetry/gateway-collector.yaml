apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-collector
  namespace: argocd
  labels:
    app.kubernetes.io/name: gateway-collector
    app.kubernetes.io/part-of: otel-platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/mohammadVatandoost/localtelemetry
    targetRevision: HEAD
    path: platform/telemetry/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
