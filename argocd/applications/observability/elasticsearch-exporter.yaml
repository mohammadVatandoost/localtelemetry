apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elasticsearch-exporter
  namespace: argocd
  labels:
    app.kubernetes.io/name: elasticsearch-exporter
    app.kubernetes.io/part-of: otel-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-elasticsearch-exporter
      targetRevision: 7.5.0
      helm:
        valueFiles:
          - $values/platform/observability/elasticsearch-exporter/values.yaml
    - repoURL: git://git.argocd.svc.cluster.local/otel-platform
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
