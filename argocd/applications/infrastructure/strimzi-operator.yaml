apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
  labels:
    app.kubernetes.io/name: strimzi-operator
    app.kubernetes.io/part-of: otel-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    - repoURL: oci://quay.io/strimzi-helm/strimzi-kafka-operator
      chart: strimzi-kafka-operator
      targetRevision: 1.3.1
      helm:
        valueFiles:
          - $values/platform/infrastructure/strimzi/values.yaml
    - repoURL: git://git.argocd.svc.cluster.local/otel-platform
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: strimzi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 8
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
