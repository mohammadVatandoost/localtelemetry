# Single-node Kind cluster for the local OpenTelemetry platform.
# Kubernetes 1.34 is inside the overlap of Strimzi 1.3 (1.32-1.37) and ECK 3.5 (1.32-1.36).
# The image digest is the one published with kind v0.33.0.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: otel-platform
nodes:
  - role: control-plane
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        apiVersion: kubelet.config.k8s.io/v1beta1
        evictionHard:
          memory.available: "256Mi"
          nodefs.available: "2Gi"
        kubeReserved:
          cpu: "200m"
          memory: "512Mi"
        systemReserved:
          cpu: "100m"
          memory: "512Mi"
    # containerPort is the NodePort on the Kind node. hostPort is what you open on Ubuntu.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
      - containerPort: 30601
        hostPort: 5601
        protocol: TCP
      - containerPort: 30920
        hostPort: 9200
        protocol: TCP
      - containerPort: 30317
        hostPort: 4317
        protocol: TCP
      - containerPort: 30318
        hostPort: 4318
        protocol: TCP
